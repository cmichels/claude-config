name: CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          set -e
          for f in *.sh bin/*; do
            if [ -f "$f" ]; then
              bash -n "$f"
            fi
          done

      - name: JSON template validity
        run: jq empty settings.json.template

      - name: Agent and command frontmatter
        run: |
          set -e
          for f in agents/*.md commands/*.md; do
            if [ "$(head -n1 "$f")" != "---" ]; then
              echo "::error file=$f::first line must be exactly '---' (YAML frontmatter opener)"
              exit 1
            fi
            if [ "$(grep -c '^---$' "$f")" -lt 2 ]; then
              echo "::error file=$f::frontmatter block is never closed with '---'"
              exit 1
            fi
          done

      - name: Personal path leak check
        run: |
          leaks=$(git grep -nE '/home/[a-z0-9]+' -- ':!.github/workflows/ci.yml' | grep -v '/home/user' || true)
          if [ -n "$leaks" ]; then
            echo "$leaks"
            echo "::error::personal absolute paths found in tracked files (use ~ or /home/user in examples)"
            exit 1
          fi
